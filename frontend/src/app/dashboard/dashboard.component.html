<mat-toolbar color="primary">
  <span>Employee Portal</span>
  <span class="spacer"></span>
  <span>Welcome, {{ user?.name }} ({{ user?.role }})</span>
  <button mat-button (click)="logout()">Logout</button>
</mat-toolbar>

<div class="dashboard-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Your Records</mat-card-title>
      <mat-card-subtitle>Data is loaded asynchronously with a simulated API delay.</mat-card-subtitle>
    </mat-card-header>
    
    <mat-card-content>
      <!-- Loading Skeleton/Spinner -->
      <div *ngIf="loading" class="loading-shade">
        <mat-spinner></mat-spinner>
      </div>

      <!-- Data Table -->
      <div class="table-container" [class.hidden]="loading">
        <table mat-table [dataSource]="dataSource" matSort>

          <!-- ID Column -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
            <td mat-cell *matCellDef="let element"> {{element.id}} </td>
          </ng-container>

          <!-- Title Column -->
          <ng-container matColumnDef="title">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Title </th>
            <td mat-cell *matCellDef="let element"> {{element.title}} </td>
          </ng-container>

          <!-- Description Column -->
          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Description </th>
            <td mat-cell *matCellDef="let element"> {{element.description}} </td>
          </ng-container>

          <!-- Created At Column -->
          <ng-container matColumnDef="createdAt">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Date </th>
            <td mat-cell *matCellDef="let element"> {{element.createdAt | date}} </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
